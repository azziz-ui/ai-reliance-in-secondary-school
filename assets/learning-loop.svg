<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Think, ask, verify</title>
  <desc id="desc">A visual learning loop for an exploratory study of students and AI at NIS Karaganda.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#10192F"/>
      <stop offset="1" stop-color="#1B3151"/>
    </linearGradient>
    <linearGradient id="glow" x2="1" y2="1">
      <stop stop-color="#6DE1CB"/>
      <stop offset="1" stop-color="#98B6FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1028" cy="92" r="220" fill="#70DCCA" opacity=".06"/>
  <circle cx="864" cy="320" r="190" fill="#9AB4FF" opacity=".045"/>

  <rect x="64" y="57" width="171" height="30" rx="15" fill="#6DE1CB" fill-opacity=".13" stroke="#6DE1CB" stroke-opacity=".43"/>
  <text x="79" y="77" fill="#9BF0DD" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">RESEARCH · 2026</text>

  <text x="64" y="161" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Think first.</text>
  <text x="64" y="221" fill="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Use AI thoughtfully.</text>
  <text x="66" y="268" fill="#B8C7D9" font-family="Arial, Helvetica, sans-serif" font-size="18">Student perspectives on AI, learning, and reliance</text>
  <path d="M65 320H502" stroke="#A9C4D8" stroke-opacity=".25"/>
  <text x="66" y="350" fill="#9FBDD3" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.4">NIS KARAGANDA, KAZAKHSTAN</text>

  <path d="M790 128C822 84 916 83 946 126" fill="none" stroke="#B4C8E1" stroke-opacity=".56" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M969 169C1028 192 1018 268 971 292" fill="none" stroke="#B4C8E1" stroke-opacity=".56" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M902 320C848 345 779 311 769 266" fill="none" stroke="#B4C8E1" stroke-opacity=".56" stroke-width="2.5" stroke-linecap="round"/>
  <path d="m941 119 10 9-14 2M968 286l7 9-13 4M767 275l-3-14 14 3" fill="none" stroke="#B4C8E1" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="744" cy="189" r="67" fill="#243851" stroke="#6DE1CB" stroke-width="2"/>
  <circle cx="961" cy="152" r="67" fill="#243851" stroke="#9BB7FF" stroke-width="2"/>
  <circle cx="961" cy="319" r="67" fill="#243851" stroke="#E4B77D" stroke-width="2"/>
  <text x="744" y="178" text-anchor="middle" fill="#6DE1CB" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">01</text>
  <text x="744" y="207" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">THINK</text>
  <text x="961" y="141" text-anchor="middle" fill="#AFC4FF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">02</text>
  <text x="961" y="170" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ASK</text>
  <text x="961" y="308" text-anchor="middle" fill="#F2C691" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">03</text>
  <text x="961" y="337" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">VERIFY</text>
</svg>
